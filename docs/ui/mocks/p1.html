<!doctype html>
<html><head><meta charset="utf-8"><title>MemGallery - Material 3 Expressive</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DCDAE1;font-family:'Manrope','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:44px 36px 56px}
.head{display:flex;align-items:flex-end;justify-content:space-between;max-width:1290px;margin:0 auto 26px;color:#171619}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.head p{font-size:13px;font-weight:600;color:#5D5A63;margin-top:6px}
.board{display:grid;grid-template-columns:repeat(3,390px);gap:30px;justify-content:center}
.wrap{width:390px}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;box-shadow:0 26px 60px rgba(20,18,30,.26);background:#000;position:relative}
.cap{font-size:12px;font-weight:750;color:#5D5A63;margin:10px 4px 0;letter-spacing:.2px}
.lt{--surface:#FBFAF7;--scl:#FFFFFF;--sclow:#F4F2EC;--sc:#ECE9E1;--sch:#E3DFD5;--on:#171619;--onv:#5D5A63;--out:#8F8C95;--outv:#DCD8CE;--pri:#5B4BFF;--onpri:#FFFFFF;--pric:#E5E0FF;--onpric:#1C0F6E;--sec:#FF6B4A;--ter:#C6F24E;--err:#BA1A1A;--ok:#0F8A5F}
.dk{--surface:#0E0D12;--scl:#08070B;--sclow:#14131A;--sc:#1A1922;--sch:#24222D;--on:#EDEAF2;--onv:#A8A4B3;--out:#6E6A78;--outv:#322F3A;--pri:#B9AEFF;--onpri:#2A1E6E;--pric:#3A2FA0;--onpric:#E5E0FF;--sec:#FF9B80;--ter:#D6F98A;--err:#FFB4AB;--ok:#6EE7B0}
.screen{width:100%;height:100%;background:var(--surface);color:var(--on);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:750}
.body{flex:1;min-height:0;padding:0 20px;display:flex;flex-direction:column;gap:16px}
.disp{font-size:34px;line-height:38px;font-weight:800;letter-spacing:-.7px}
.hd{font-size:26px;line-height:31px;font-weight:760;letter-spacing:-.4px}
.ttl{font-size:19px;line-height:24px;font-weight:720;letter-spacing:-.2px}
.bd{font-size:15px;line-height:22px;font-weight:450}
.lb{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.2px}
.mut{color:var(--onv)}
.card{background:var(--sc);border:1px solid var(--outv);border-radius:20px;padding:16px}
.nav{height:86px;flex:none;display:flex;align-items:center;justify-content:space-around;background:var(--sc);border-top:1px solid var(--outv);padding:0 8px 10px}
.navi{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--onv);width:62px}
.navi.on{color:var(--on)}
.fab{width:60px;height:60px;border-radius:999px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 10px 22px rgba(91,75,255,.35)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:720}
.pf{background:var(--pri);color:var(--onpri)}
.pt{background:var(--pric);color:var(--onpric)}
.pi{background:transparent;color:var(--pri);border:1px solid var(--outv)}
.search{display:flex;align-items:center;gap:10px;background:var(--sc);border:1px solid var(--outv);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:550;color:var(--onv)}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--onv)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;height:178px;border-radius:20px;overflow:hidden;border:1px solid var(--outv);background:var(--sclow)}
.lbl{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;font-size:10px;font-weight:750;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));text-shadow:0 1px 3px rgba(0,0,0,.55)}
svg{display:block}
</style></head>
<body>
<div class="head"><div><h1>MemGallery &middot; Material 3 Expressive</h1><p>Premium pass on every screen. Light and dark. Tap any screen to zoom.</p></div><div class="lb" style="color:#5D5A63">v0.3.4 &nbsp;Â&middot;&nbsp; 5 Nov 2026</div></div>
